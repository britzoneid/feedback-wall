<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>Feedback Wall</title>
		<style>
		/* ──────────────────────────────────────────────
   Brand tokens – swap these to re-theme instantly
   ────────────────────────────────────────────── */
		:root {
			/* Raw brand palette */
			--color-bz-yellow: #f5b83b;
			--color-bz-dark: #111111;
			--color-bz-red: #e31837;
			--color-bz-white: #ffffff;

			/* Mapped design tokens */
			--brand-bg: var(--color-bz-dark);
			--brand-surface: var(--color-bz-white);
			--brand-text: var(--color-bz-dark);

			--brand-accent: var(--color-bz-yellow); /* "live" indicator   */
			--brand-muted: rgba(255, 255, 255, 0.35); /* idle status text  */

			--card-shadow: rgba(17, 17, 17, 0.45);
			--card-tape-bg: rgba(245, 184, 59, 0.55); /* translucent yellow */
			--card-tape-border: rgba(245, 184, 59, 0.3);

			--card-width: 300px;
			--card-radius: 3px;
			--gap: 1.4rem;
		}

		/* ────────────────────────────────────────────── */

		* {
			margin: 0;
			box-sizing: border-box;
		}

		body {
			min-height: 100vh;
			background: var(--brand-bg);
			font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
			padding: 2.5rem;
			display: flex;
			flex-wrap: wrap;
			gap: var(--gap);
			align-content: flex-start;
			justify-content: center;
			overflow-x: hidden;
		}

		.card {
			background: var(--brand-surface);
			color: var(--brand-text);
			padding: 1.3rem 1.5rem;
			width: var(--card-width);
			min-height: 80px;
			border-radius: var(--card-radius);
			box-shadow: 2px 5px 14px var(--card-shadow);
			font-size: 1.05rem;
			line-height: 1.55;
			word-break: break-word;
			animation: pop 0.4s cubic-bezier(0.34, 1.56, 0.64, 1) both;
			position: relative;
		}

		/* subtle "tape" strip at top */
		.card::before {
			content: "";
			position: absolute;
			top: -8px;
			left: 50%;
			transform: translateX(-50%) rotate(-1deg);
			width: 60px;
			height: 16px;
			background: var(--card-tape-bg);
			border: 1px solid var(--card-tape-border);
		}

		@keyframes pop {
			from {
				opacity: 0;
				transform: scale(0.6) translateY(24px);
			}
			to {
				opacity: 1;
				transform: scale(1) translateY(0);
			}
		}

		.status {
			position: fixed;
			bottom: 1rem;
			right: 1.5rem;
			font-size: 0.75rem;
			color: var(--brand-muted);
			font-family: monospace;
		}
		.status.connected {
			color: var(--brand-accent);
		}
		</style>
	</head>
	<body>
		<div class="status" id="status">connecting…</div>

		<script>
		const statusEl = document.getElementById("status");
		let reconnectDelay = 1000;

		function addCard(text) {
			const el = document.createElement("div");
			el.className = "card";
			el.textContent = text; // safe — no innerHTML
			const tilt = (Math.random() * 5 - 2.5).toFixed(1);
			el.style.setProperty("--tilt", tilt + "deg");
			el.style.transform = `rotate(${tilt}deg)`;
			document.body.prepend(el);
		}

		function connect() {
			const proto = location.protocol === "https:" ? "wss" : "ws";
			const ws = new WebSocket(`${proto}://${location.host}/ws`);

			ws.onopen = () => {
				statusEl.textContent = "● live";
				statusEl.className = "status connected";
				reconnectDelay = 1000;
			};

			ws.onmessage = (e) => {
				const msg = JSON.parse(e.data);
				if (msg.type === "history") {
					msg.items.forEach(addCard);
				} else if (msg.type === "new") {
					addCard(msg.text);
				}
			};

			ws.onclose = () => {
				statusEl.textContent = "reconnecting…";
				statusEl.className = "status";
				setTimeout(connect, reconnectDelay);
				reconnectDelay = Math.min(reconnectDelay * 2, 10000);
			};

			ws.onerror = () => ws.close();
		}

		connect();
		</script>
	</body>
</html>
