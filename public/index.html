<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>Feedback Wall</title>
		<link rel="stylesheet" href="styles.css">
	</head>
	<body>
		<div class="wall" id="wall"></div>
		<div class="status" id="status">connecting…</div>

		<script>
		const wall = document.getElementById("wall");
		const statusEl = document.getElementById("status");
		let reconnectDelay = 1000;

		/* Map content length → card size tier, so each card
   is proportionate to its own content. */
		function tierFor(text) {
			const n = text.length;
			if (n < 30) return "xs";
			if (n < 80) return "sm";
			if (n < 160) return "md";
			if (n < 300) return "lg";
			return "xl";
		}

		/* Deterministic-ish color accent: mostly white,
   with occasional yellow / dark / red feature cards. */
		function variantFor(text) {
			const r = Math.random();
			if (text.length < 30) return r < 0.6 ? "card--accent" : "card--dark";
			if (r < 0.1) return "card--accent";
			if (r < 0.22) return "card--dark";
			return "";
		}

		function addCard(text, { delay = 0, createdAt = null } = {}) {
			const tier = tierFor(text);

			const el = document.createElement("article");
			el.className = `card card--${tier} ${variantFor(text)}`.trim();

			/* gentle rotation for a hand-placed feel */
			const tilt = (Math.random() * 1.6 - 0.8).toFixed(2);
			const tapeRot = (Math.random() * 5 - 2.5).toFixed(1);
			el.style.setProperty("--tilt", tilt + "deg");
			el.style.setProperty("--tape-rot", tapeRot + "deg");
			el.style.transform = `rotate(${tilt}deg)`;
			el.style.animationDelay = delay + "ms";

			const textEl = document.createElement("div");
			textEl.className = "text";
			textEl.textContent = text; // safe — no innerHTML

			const meta = document.createElement("time");
			meta.className = "meta";
			const ts = createdAt ? new Date(createdAt * 1000) : new Date();
			meta.dateTime = ts.toISOString();
			meta.title = ts.toLocaleString(undefined, {
				dateStyle: "full",
				timeStyle: "medium",
			});
			meta.textContent = ts.toLocaleDateString("en-GB", {
				day: "numeric",
				month: "short",
				year: "numeric",
			});

			el.append(meta, textEl);
			wall.prepend(el); // newest first; dense flow re-packs automatically
		}

		let pingTimer;

		function connect() {
			const proto = location.protocol === "https:" ? "wss" : "ws";
			const ws = new WebSocket(`${proto}://${location.host}/ws`);

			ws.onopen = () => {
				statusEl.textContent = "live";
				statusEl.className = "status connected";
				reconnectDelay = 1000;
				pingTimer = setInterval(() => {
					if (ws.readyState === WebSocket.OPEN) {
						ws.send(JSON.stringify({ type: "ping" }));
					}
				}, 30000);
			};

			ws.onmessage = (e) => {
				const msg = JSON.parse(e.data);
				if (msg.type === "history") {
					wall.innerHTML = "";
					msg.items.forEach((item, i) => {
						addCard(item.text, { delay: i * 60, createdAt: item.createdAt });
					});
				} else if (msg.type === "new") {
					addCard(msg.text, { createdAt: Math.floor(Date.now() / 1000) });
				}
			};

			ws.onclose = () => {
				clearInterval(pingTimer);
				statusEl.textContent = "reconnecting…";
				statusEl.className = "status";
				setTimeout(connect, reconnectDelay);
				reconnectDelay = Math.min(reconnectDelay * 2, 10000);
			};

			ws.onerror = () => ws.close();
		}

		connect();
		</script>
		<!-- Default Statcounter code for Britzone Feedback Wall
https://feedback.britzone.id -->
		<script type="text/javascript">
		var sc_project = 13341026;
		var sc_invisible = 1;
		var sc_security = "9db64002";
		</script>
		<script
			type="text/javascript"
			src="https://www.statcounter.com/counter/counter.js"
			async
		></script>
		<noscript>
			<div class="statcounter">
				<a
					title="website
statistics"
					href="https://statcounter.com/"
					target="_blank"
					><img
						class="statcounter"
						src="https://c.statcounter.com/13341026/0/9db64002/1/"
						alt="website statistics"
						referrerpolicy="no-referrer-when-downgrade"
					></a
				>
			</div>
		</noscript>
		<!-- End of Statcounter Code -->
	</body>
</html>
